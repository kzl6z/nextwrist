# Reglages metier. Modifiables sans toucher au code.
# Les valeurs techniques (URL, modeles) sont dans .env, pas ici.

[recherche]
# Nombre d'extraits injectes dans le contexte. 4-8 est la bonne zone :
# en dessous Nova manque d'information, au dessus le signal se noie.
extraits_max = 6
# Nombre de candidats remontes par chaque moteur avant fusion.
candidats_par_moteur = 20

[decoupage]
# ~1000 caracteres : assez pour garder un raisonnement entier,
# assez petit pour que l'extrait reste precis.
taille = 1000
recouvrement = 150

[memoire]
# Au dela, on n'injecte plus tous les faits : il faudra les hierarchiser (V0.3).
faits_max_dans_prompt = 80
# ── Budget en CARACTERES du bloc de memoire ──────────────────────────────
#
# Le compte de faits ne suffit pas. Sur un modele local, le temps de reponse
# est proportionnel a la TAILLE du prompt, pas au nombre de lignes. Mesure sur
# l'iMac M1 :
#
#     prompt 6573 car.  ->  21,4 s avant le premier mot
#
# Soit environ 3,3 ms par caractere. Les 80 faits autorises pesaient a eux
# seuls ~5 500 caracteres : dix-huit secondes d'attente, sur chaque question,
# uniquement pour relire la memoire.
#
# La consequence, si on ne borne pas : NOVA RALENTIT A MESURE QU'ELLE APPREND.
# C'est le pire defaut possible pour un systeme dont l'accumulation est la
# raison d'etre — il punit exactement l'usage qu'on veut encourager, et il
# arrive assez lentement pour qu'on l'attribue a autre chose.
#
# 1200 caracteres ~ 4 s de lecture. Au-dela, il faudra choisir les faits
# pertinents plutot que tous les envoyer (V0.3).
budget_caracteres_prompt = 1200
