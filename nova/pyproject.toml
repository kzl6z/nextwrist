[project]
name = "nova"
version = "0.1.0"
description = "Nova — assistant personnel local et evolutif"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "httpx>=0.27",
    "typer>=0.15",
    "rich>=13.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]
# Transcription locale. Volontairement separe : lourd, et inutile a qui ne
# parle pas a Nova.  uv pip install -e ".[voice]"
voice = ["faster-whisper>=1.0"]
# Synthese vocale locale. Separee de `voice` a dessein : entendre Nova et lui
# parler sont deux besoins distincts, et celui-ci tire torch. Qui dicte sans
# ecouter n'a aucune raison de telecharger un gigaoctet de plus.
#
# ⚠️ `espeak-ng` EST INDISPENSABLE AU FRANCAIS, ET AUCUNE DOC NE LE DIT.
# Sans lui, la phonemisation echoue avec un message qui parle de tout sauf de
# ca.   brew install espeak-ng
speech = ["kokoro>=0.9"]
# Synthese Piper : un modele = une voix, 60 Mo sur onnx, sans torch. C'est
# aussi le format d'un modele AFFINE sur une vraie voix — donc le chemin par
# lequel un clone arrive. Il embarque son propre espeak-ng : contrairement a
# `speech`, aucune dependance systeme a installer a cote.
piper = ["piper-tts>=1.7"]
# Vision. Pillow seul — le MODELE multimodal vit dans Ollama, pas ici.
#
# ⚠️ CETTE LIGNE NE SUFFIT PAS A FAIRE VOIR NOVA.
#
# Pillow reduit et convertit les images ; sans lui, un HEIC d'iPhone est
# illisible et une photo de 8 Mo part telle quelle jusqu'a expirer le delai
# du moteur. Mais voir demande en plus  ollama pull moondream  et
# NOVA_VISION_ACTIVE=true, parce que le modele decharge celui de la langue
# sur une machine de 8 Go.
vision = ["pillow>=10"]

[project.scripts]
nova = "nova.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Les bancs d'essai de `scripts/` sont du code du projet, pas des scripts
# jetables : ils sont testes comme le reste. Sans cette ligne, ruff les range
# parmi les dependances tierces et reclame un ordre d'import impossible.
known-first-party = ["nova", "bench_whisper", "bench_models", "enregistrer_voix"]

[tool.ruff.lint.per-file-ignores]
# FastAPI : `File(...)`, `Form(...)`, `Depends(...)` dans les valeurs par defaut
# est l'idiome officiel du framework, pas un piege de mutabilite.
"src/nova/api/*" = ["B008"]
# Ces bancs contiennent des reproductions A L'IDENTIQUE de blocs de `tts.js`,
# l'appli de bureau. Leur valeur tient a leur fidelite : reformater les lignes
# pour tenir en 100 colonnes en ferait des approximations, et les tests ne
# prouveraient plus que les correctifs s'appliquent au vrai fichier.
"tests/test_tts_diagnostic.py" = ["E501"]
"tests/test_branchement_voix.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
