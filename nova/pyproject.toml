[project]
name = "nova"
version = "0.1.0"
description = "Nova — assistant personnel local et evolutif"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "httpx>=0.27",
    "typer>=0.15",
    "rich>=13.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]
# Transcription locale. Volontairement separe : lourd, et inutile a qui ne
# parle pas a Nova.  uv pip install -e ".[voice]"
voice = ["faster-whisper>=1.0"]

[project.scripts]
nova = "nova.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI : `File(...)`, `Form(...)`, `Depends(...)` dans les valeurs par defaut
# est l'idiome officiel du framework, pas un piege de mutabilite.
"src/nova/api/*" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
